<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Opção Contabilidade</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){var t="dark";try{var v=localStorage.getItem("tema_v1");if(v==="light"||v==="dark")t=v}catch(e){}document.documentElement.setAttribute("data-theme",t)})()</script>
<style>
:root{--bg:#f6f3ea;--panel:#ffffff;--tx:#17150f;--mut:#6f6a5e;--bd:#e3dfd2;--ac:#8a6a14;--gold:#c9a227;--btn:#141414;--btnt:#e8c65a;--bad:#b42318;--rule:rgba(138,106,20,.28);--glow:rgba(201,162,39,.16);--serif:"Instrument Serif",Georgia,serif;--sans:"Manrope",system-ui,Arial,sans-serif}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a0a09;--panel:#151513;--tx:#f4f1e8;--mut:#a39d8c;--bd:#2b2820;--ac:#d9b44a;--gold:#d9b44a;--btn:#d9b44a;--btnt:#141414;--bad:#ff8a80;--rule:rgba(217,180,74,.22);--glow:rgba(217,180,74,.14)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--tx);font-size:15px;-webkit-font-smoothing:antialiased}
.shell{min-height:100svh;display:grid;grid-template-columns:1.15fr .85fr}

/* painel da marca */
.brand{--px:clamp(28px,5vw,64px);--step:64px;position:relative;overflow:hidden;padding:var(--px);display:flex;flex-direction:column;background:radial-gradient(900px 500px at 15% 10%,var(--glow),transparent 60%),var(--bg);border-right:1px solid var(--bd)}
@media (max-height:820px){.brand{--step:56px}}
@media (max-height:700px){.brand{--step:48px}}
.ledger{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to top,var(--rule) 0,var(--rule) 1px,transparent 1px,transparent var(--step));-webkit-mask-image:linear-gradient(to bottom,transparent 12%,#000 55%);mask-image:linear-gradient(to bottom,transparent 12%,#000 55%);animation:reveal 1.4s cubic-bezier(.2,.7,.2,1) both}
.ledger b{position:absolute;top:0;bottom:0;left:calc(var(--px) - 20px);width:1px;background:var(--rule)}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.logo{display:inline-block;align-self:flex-start;position:relative;z-index:1;line-height:0}
.logo img{height:auto;width:clamp(170px,20vw,260px);display:block}
:root[data-theme="light"] .logo{background:#000;padding:12px 18px;border-radius:14px}
:root[data-theme="light"] .logo img{width:clamp(150px,18vw,220px)}
.pitch{position:absolute;z-index:1;left:var(--px);right:var(--px);bottom:calc(var(--step)*3)}
.pitch h1{--fs:min(calc(var(--step)*.72),4.4vw);font-family:"Archivo","Arial Black",Arial,sans-serif;font-variation-settings:"wdth" 118;font-weight:800;text-transform:uppercase;font-size:var(--fs);line-height:var(--step);letter-spacing:-.01em;margin:0;position:relative;top:calc(var(--step)/2 - .334*var(--fs) - 2px)}
.pitch h1 span{display:block;white-space:nowrap}
.pitch p{color:var(--mut);font-size:15px;line-height:calc(var(--step)/2);margin:0;height:var(--step);width:min(100%,400px);position:relative;top:9px}

/* formulário */
.side{display:grid;place-items:center;padding:28px;position:relative}
.theme{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--panel);color:var(--mut);cursor:pointer;font-size:16px}
.theme:hover{color:var(--tx);border-color:var(--ac)}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--bd);border-radius:20px;padding:36px 32px 30px;box-shadow:0 30px 80px -40px rgba(0,0,0,.55)}
.card h2{font-family:var(--serif);font-weight:400;font-size:34px;margin:0 0 6px}
.card .sub{color:var(--mut);margin:0 0 26px;font-size:14px}
.f{margin-bottom:16px}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.inp{position:relative}
.inp input{width:100%;font:inherit;font-size:15px;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:12px;padding:14px 14px;transition:border-color .15s,box-shadow .15s}
.inp input::placeholder{color:var(--mut);opacity:.7}
.inp input:hover{border-color:var(--mut)}
.inp input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--glow)}
.inp.err input{border-color:var(--bad)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);cursor:pointer;font:inherit;font-size:13px;font-weight:600;padding:8px 10px;border-radius:8px}
.eye:hover{color:var(--tx)}
.pw input{padding-right:78px}
.opts{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 22px;font-size:13px}
.chk{display:inline-flex;align-items:center;gap:8px;color:var(--mut);cursor:pointer}
.chk input{accent-color:var(--gold);width:16px;height:16px;margin:0}
.opts a{color:var(--ac);text-decoration:none;font-weight:600}
.opts a:hover{text-decoration:underline}
.go{width:100%;font:inherit;font-weight:700;font-size:15px;padding:15px;border:0;border-radius:12px;background:var(--btn);color:var(--btnt);cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;transition:transform .12s,filter .15s}
.go:hover{filter:brightness(1.08)}
.go:active{transform:scale(.99)}
.go:disabled{opacity:.7;cursor:wait}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite;display:none}
.go.load .spin{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.msg{min-height:20px;margin:14px 0 0;font-size:13px;color:var(--bad);text-align:center}
.foot{margin-top:18px;padding-top:18px;border-top:1px solid var(--bd);text-align:center;font-size:12px;color:var(--mut)}
a:focus-visible,button:focus-visible,.chk:has(input:focus-visible){outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .brand{border-right:0;border-bottom:1px solid var(--bd);padding:24px 22px 28px}
  .pitch{position:static;margin:28px 0 0}
  .pitch h1{--fs:clamp(24px,7.4vw,34px);line-height:1.08;top:0;margin-bottom:14px}
  .pitch p{font-size:14px;line-height:1.55;height:auto;top:0}
  .ledger{display:none}
  .side{padding:24px 16px 40px;align-items:start}
  .card{padding:28px 22px 24px}
}
@media (prefers-reduced-motion:reduce){.ledger,.spin{animation:none}}
</style>
</head>

    <div class="pitch">
      <h1><span>Folha,</span> <span>descontos e</span> <span>certificados</span> <span>em ordem.</span></h1>
      <p>Consulte cadastros, acompanhe vencimentos e produza Autorizações sem sair desta tela.</p>

  </section>

  <main class="side">
    <button class="theme" id="tema" type="button" aria-label="Alternar tema claro e escuro">◐</button>
    <div class="card">
      <h2>Bem-vindo de volta</h2>
      <p class="sub">Entre com seu usuário e senha.</p>
      <form id="login" novalidate>
        <div class="f">
          <label for="user">Usuário ou e-mail</label>
          <div class="inp" id="gu"><input id="user" name="user" type="text" autocomplete="username" placeholder="nome@opcao.com.br" required></div>
        </div>
        <div class="f">
          <label for="pass">Senha</label>
          <div class="inp pw" id="gp"><input id="pass" name="pass" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
            <button class="eye" id="eye" type="button" aria-label="Mostrar senha">Mostrar</button></div>
        </div>
        <div class="opts">
          <label class="chk"><input type="checkbox" id="lembrar"> Manter conectado</label>
          <a href="#" id="esqueci">Esqueci a senha</a>
        </div>
        <button class="go" id="go" type="submit"><span class="spin"></span><span id="goT">Entrar</span></button>
        <p class="msg" id="msg" role="alert" aria-live="polite"></p>
      </form>
      <div class="foot">Acesso restrito à equipe da Opção Contabilidade.</div>
    </div>
  </main>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var root=document.documentElement;

  // tema (mesma chave usada pelo restante do sistema)
  $("tema").onclick=function(){
    var t=root.getAttribute("data-theme")==="dark"?"light":"dark";
    root.setAttribute("data-theme",t);
    try{localStorage.setItem("tema_v1",t)}catch(e){}
  };

  // mostrar/ocultar senha
  $("eye").onclick=function(){
    var p=$("pass"),show=p.type==="password";
    p.type=show?"text":"password";
    this.textContent=show?"Ocultar":"Mostrar";
    this.setAttribute("aria-label",show?"Ocultar senha":"Mostrar senha");
  };

  $("esqueci").onclick=function(e){
    e.preventDefault();
    $("msg").textContent="Peça a redefinição da senha ao administrador do sistema.";
  };

  // >>> Ligue aqui o seu login real. Deve retornar uma Promise (resolve = ok, reject = erro).
  function autenticar(usuario,senha,manter){
    return new Promise(function(ok,fail){
      setTimeout(function(){
        // TODO: trocar por sua validação (API, Firebase, etc.)
        fail(new Error("Usuário ou senha incorretos. Confira os dados e tente de novo."));
      },900);
    });
  }

  $("login").addEventListener("submit",function(e){
    e.preventDefault();
    var u=$("user").value.trim(),s=$("pass").value,m=$("msg");
    $("gu").classList.toggle("err",!u);
    $("gp").classList.toggle("err",!s);
    if(!u||!s){m.textContent="Preencha usuário e senha para entrar.";(u?$("pass"):$("user")).focus();return}
    m.textContent="";
    var b=$("go");b.disabled=true;b.classList.add("load");$("goT").textContent="Entrando…";
    autenticar(u,s,$("lembrar").checked).then(function(){
      window.location.href="index.html";
    }).catch(function(err){
      m.textContent=err.message;
      $("gp").classList.add("err");
      b.disabled=false;b.classList.remove("load");$("goT").textContent="Entrar";
      $("pass").select();
    });
  });
})();
</script>
